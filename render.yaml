services:
  - type: web
    name: pb-api
    runtime: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - fromGroup: pb-secrets
